# Members of TSpectrum<T>, rendered by _includes/members.html on TSpectrum and
# on every type that inherits it. @T is replaced with the page's data point type.
properties:
  - name: Count
    type: int
    desc: 'The number of data points. Stored rather than computed from DataPoints.Length, for speed.'
  - name: DataPoints
    type: '@T[]'
    desc: 'The data points. Assigning a new array here directly does not update Count; use Resize.'
methods:
  - syntax: Deserialize(byte[] data)
    returns: void
    page: TSpectrum.Deserialize
    desc: 'Reads a byte array into spectrum object data members.'
  - syntax: Dispose()
    returns: void
    page: TSpectrum.Dispose
    desc: 'A no-op beyond marking the instance disposed; a spectrum holds no unmanaged resources.'
  - syntax: GetMz(double mz, double ppm = 0)
    returns: int
    page: TSpectrum.GetMz
    desc: 'Finds the data point at an m/z, or the nearest one within a tolerance.'
  - syntax: Resize(int sz)
    returns: void
    page: TSpectrum.Resize
    desc: 'Replaces the data points with a new, empty array of the given size. Existing points are discarded.'
  - syntax: Serialize()
    returns: byte[]
    page: TSpectrum.Serialize
    desc: 'Writes spectrum object data members into a byte array. Not every member is carried.'
